# 构建并发布 fnmusic-sources 多架构镜像到 Docker Hub。
#
# 为什么单独建 workflow：CI 里的 images-multiarch 只做验证（load:true，不推送）。
# 本 workflow 负责真正产出可拉取的镜像，供 docker-compose.prebuilt.yml 使用。
#
# 速度要点：arm64 走 GitHub ARM 原生 runner（ubuntu-24.04-arm），不用 QEMU 模拟；
# 境外 runner 直连 GitHub / Docker Hub / PyPI / nodejs.org，因此无需预置
# lxserver zip、无需处理 CRLF、无需绕 IPv6。NAS 原生 arm64 构建单次墙钟更快，
# 但本流水线胜在 push 即出镜像、可重复、不依赖本地环境。
#
# 首次使用需在仓库 Settings → Secrets and variables → Actions 添加：
#   DOCKERHUB_USERNAME = joe1280
#   DOCKERHUB_TOKEN    = <Docker Hub PAT>
# 见 docs/DOCKER_DEPLOY.md「维护者：构建并推送镜像」。
name: Publish fnmusic-sources image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像 tag（如 3.1.2-meow）；留空时用触发的 Git tag"
        required: false
        default: ""
      update_latest:
        description: "同时更新 :latest"
        required: false
        default: true
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE_NAME: joe1280/fnmusic-sources

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          # ARM 原生 runner：public 仓库免费可用，避免 QEMU 模拟导致的数倍耗时。
          # 若该标签在你的仓库不可用，改为 ubuntu-latest 并在下方加
          # docker/setup-qemu-action@v3（会明显变慢）。
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$TAG" ]; then TAG="dev-${GITHUB_SHA::7}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved image tag: $TAG"

      - name: Build and push ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}-${{ matrix.suffix }}
          # 境外 runner 用官方源；国内自建可用 mirrors.tencent.com 覆盖
          build-args: |
            BASE_IMAGE=python:3.13-slim
            PIP_INDEX_URL=https://pypi.org/simple
            APT_MIRROR=
          cache-from: type=gha,scope=fnmusic-publish-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=fnmusic-publish-${{ matrix.suffix }}
          provenance: false

  manifest:
    name: create multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$TAG" ]; then TAG="dev-${GITHUB_SHA::7}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Merge amd64 + arm64 into one tag
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          TAGS=(-t "${IMAGE_NAME}:${TAG}")
          if [ "${{ inputs.update_latest }}" != "false" ]; then
            TAGS+=(-t "${IMAGE_NAME}:latest")
          fi
          docker buildx imagetools create "${TAGS[@]}" \
            "${IMAGE_NAME}:${TAG}-amd64" \
            "${IMAGE_NAME}:${TAG}-arm64"
          docker buildx imagetools inspect "${IMAGE_NAME}:${TAG}"
