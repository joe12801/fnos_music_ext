# fnmusic-ext 预构建镜像部署（免本地编译，含第五音源 meow）
#
# 用法：
#   docker compose -f docker-compose.prebuilt.yml up -d
#
# 镜像地址可用 FNMUSIC_IMAGE 覆盖：
#   - Docker Hub（默认）：joe1280/fnmusic-sources:3.1.2-meow
#   - 阿里云 ACR 国内镜像：
#       FNMUSIC_IMAGE=crpi-wv2uaegt8g2y0g3c.cn-guangzhou.personal.cr.aliyuncs.com/joeloveqt-project/joeloveqt:3.1.2-meow \
#         docker compose -f docker-compose.prebuilt.yml up -d
#   - GitHub Container Registry（ghcr.io，公开镜像免登录）：
#       FNMUSIC_IMAGE=ghcr.io/joe12801/fnos_music_ext:3.1.2-meow \
#         docker compose -f docker-compose.prebuilt.yml up -d
#
# 与 docker-compose.yml 的区别：去掉 build 段，直接拉已发布镜像；其余端口、
# 卷、健康检查完全一致。详见 docs/DOCKER_DEPLOY.md。
#
# 重要：代理（官方 Socket 接管 + 飞牛桌面网关）始终由宿主机 systemd 的
# fnmusic-ext.service 运行，容器只提供音源服务与 WebUI；容器不挂 docker.sock。
services:
  fnmusic-sources:
    image: ${FNMUSIC_IMAGE:-joe1280/fnmusic-sources:3.1.2-meow}
    pull_policy: always
    container_name: fnmusic-sources
    ports:
      - "127.0.0.1:8768:8001"  # musicdl（代理访问）
      - "127.0.0.1:8770:8002"  # netease（仅本机；扫码走已登录的 WebUI）
      - "127.0.0.1:8772:8003"  # lxmusic（代理访问）
      - "127.0.0.1:8774:8004"  # WebUI（仅本机；浏览器走飞牛网关）
      - "127.0.0.1:8776:8006"  # mp3api（第四音源，代理访问）
      - "127.0.0.1:8778:8008"  # meow（第五音源 Meow 聚合总源，代理访问）
    volumes:
      - ./sources-data:/data
      - .:/repo
      # 宿主机维护 socket 只读挂入，供 WebUI 处理维护类端点
      - /run/fnmusic-ext:/run/fnmusic-ext:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
